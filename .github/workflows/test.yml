name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest discover -s tests -v
      - run: sh -n install.sh
      - run: systemd-analyze verify systemd/warden-collector.service
      - name: Passive Linux collector smoke test
        run: |
          tempdir=$(mktemp -d)
          python -B -m warden --database "$tempdir/history.sqlite3" collect --once
          python -B -m warden --database "$tempdir/history.sqlite3" status --json
          python -B -m warden --database "$tempdir/history.sqlite3" history --json
