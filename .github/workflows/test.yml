name: Tests
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -B -m unittest discover -s tests -v
      - name: Real kernel routing and bound ping in an isolated namespace
        run: sudo $(which python) -B -m unittest discover -s tests -p test_diagnostics.py -v
      - run: sh -n install.sh
      - run: systemd-analyze verify systemd/warden-collector.service
      - name: Passive Linux collector smoke test
        run: |
          tempdir=$(mktemp -d)
          python -B -m warden --database "$tempdir/history.sqlite3" collect --once
          python -B -m warden --database "$tempdir/history.sqlite3" status --json
          python -B -m warden --database "$tempdir/history.sqlite3" history --json
  tag:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Tag tested version (never move an existing tag)
        run: |
          version=$(python3 -c 'from warden import __version__; print(__version__)')
          tag="v$version"
          if git ls-remote --exit-code --tags origin "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; leaving it unchanged."
            exit 0
          fi
          git tag "$tag" "$GITHUB_SHA"
          git push origin "refs/tags/$tag"
